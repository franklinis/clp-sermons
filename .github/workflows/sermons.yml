name: Sermon Shorts

# The clips are made on a Mac at the church (scripts/mac-run.sh): YouTube doesn't allow
# downloads from cloud servers like GitHub's. When the Mac has pushed new clips to the
# `media` branch, it starts this workflow, which uses the repository's secrets to save the
# Buffer drafts and tell Teams, or to report what failed.
on:
  workflow_dispatch:
    inputs:
      failure:
        description: "Set by the Mac when making clips failed: what went wrong"
        required: false

permissions:
  contents: write

concurrency: sermon-shorts

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MEDIA_DIR: ${{ github.workspace }}/media
      WORK_DIR: ${{ github.workspace }}/.work
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: pip install -q -r requirements.txt

      - name: Check out the media branch
        run: |
          git fetch origin media
          git worktree add media FETCH_HEAD

      - name: Create Buffer drafts
        if: ${{ vars.BUFFER_VIDEO_CHANNELS != '' && inputs.failure == '' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_VIDEO_CHANNELS: ${{ vars.BUFFER_VIDEO_CHANNELS }}
          POST_TIME: ${{ vars.POST_TIME || '18:00' }}
        run: python -m sermon_clips drafts

      - name: Tell Teams
        if: ${{ always() }}
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          FAILURE: ${{ inputs.failure }}
        run: python -m sermon_clips notify ${FAILURE:+--failure "$FAILURE"}

      - name: Record drafts and notifications
        if: ${{ always() }}
        run: |
          python -m sermon_clips page
          cd media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -qm "Record Buffer drafts" && git push -q origin HEAD:media)
